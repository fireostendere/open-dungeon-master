# Open Dungeon Master. The game application remains a single process because
# SQLite writes, the event bus and media queue are intentionally in-process.
# An isolated MCP sidecar talks to the app only through the authenticated
# internal control API; it never opens the database or Docker socket itself.
#
#   docker compose up -d --build   -> app http://localhost:3005
#                                    MCP http://127.0.0.1:3006/mcp
#
# Set ODM_MCP_TOKEN in .env before enabling MCP. Generate a long random value,
# e.g. `openssl rand -hex 32`. The remote endpoint is loopback-only here; use
# an HTTPS reverse proxy or SSH tunnel rather than exposing port 3006 directly.

services:
  open-dungeon-master:
    image: ${ODM_IMAGE:-lebbi/open-dungeon-master}:${ODM_IMAGE_TAG:-latest}
    build:
      context: .
    container_name: open-dungeon-master
    restart: unless-stopped
    ports:
      - "${ODM_PORT:-3005}:3005"
      # Live voice chat. One port, both protocols. This carries the audio
      # itself, which is not HTTP, so it does NOT go through a reverse proxy.
      - "${VOICE_RTC_PORT:-44444}:${VOICE_RTC_PORT:-44444}/udp"
      - "${VOICE_RTC_PORT:-44444}:${VOICE_RTC_PORT:-44444}/tcp"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # Leave empty to have a key generated into the data volume on first boot.
      # Whatever you set here wins over the stored one.
      DB_ENCRYPTION_KEY: ${DB_ENCRYPTION_KEY:-}

      # MCP control plane. With no token the internal route fails closed (503).
      ODM_MCP_TOKEN: ${ODM_MCP_TOKEN:-}
      ODM_MCP_NARRATOR_TOKEN: ${ODM_MCP_NARRATOR_TOKEN:-}
      ODM_MCP_NARRATOR_CAMPAIGN_ID: ${ODM_MCP_NARRATOR_CAMPAIGN_ID:-}
      ODM_MCP_OWNER_USER_ID: ${ODM_MCP_OWNER_USER_ID:-}
      ODM_MCP_OWNER_USERNAME: ${ODM_MCP_OWNER_USERNAME:-}

      # Text backend: llama.cpp, or any OpenAI-compatible server.
      OPENAI_COMPAT_BASE_URL: ${OPENAI_COMPAT_BASE_URL:-http://host.docker.internal:8001/v1}
      OPENAI_COMPAT_MODEL: ${OPENAI_COMPAT_MODEL:-qwen3.6-35b}
      OPENAI_COMPAT_API_KEY: ${OPENAI_COMPAT_API_KEY:-}
      DEFAULT_TEXT_PROVIDER: ${DEFAULT_TEXT_PROVIDER:-custom}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-}

      # Images and speech. Each is optional; the app degrades gracefully.
      COMFYUI_URL: ${COMFYUI_URL:-http://host.docker.internal:8188}
      KOKORO_URL: ${KOKORO_URL:-http://host.docker.internal:8880}
      STT_URL: ${STT_URL:-http://host.docker.internal:8870}

      # Set these when running behind a reverse proxy. APP_PUBLIC_URL also fixes
      # the Discord OAuth callback URL.
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}

      # Live voice chat. Off unless VOICE_ENABLED=1.
      VOICE_ENABLED: ${VOICE_ENABLED:-0}
      VOICE_RTC_PORT: ${VOICE_RTC_PORT:-44444}
      VOICE_ANNOUNCED_IP: ${VOICE_ANNOUNCED_IP:-}
      VOICE_DOMAIN: ${VOICE_DOMAIN:-}

      # Verbose DM turn logging.
      DM_DEBUG: ${DM_DEBUG:-}
      # Content-free latency JSONL for the app-side narrator path.
      ODM_LATENCY_LOG: ${ODM_LATENCY_LOG:-}
    volumes:
      - odm-data:/app/data
      - odm-uploads:/app/public/uploads
      - odm-generated:/app/public/generated
      - odm-audio:/app/public/generated-audio
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3005/api/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 8s
      start_period: 60s
      retries: 3

  odm-mcp:
    build:
      context: .
      dockerfile: mcp/Dockerfile
    container_name: open-dungeon-master-mcp
    restart: unless-stopped
    depends_on:
      open-dungeon-master:
        condition: service_healthy
    environment:
      ODM_MCP_CONTROL_URL: http://open-dungeon-master:3005/api/internal/mcp
      ODM_MCP_TOKEN: ${ODM_MCP_TOKEN:-}
      ODM_MCP_NARRATOR_TOKEN: ${ODM_MCP_NARRATOR_TOKEN:-}
      ODM_MCP_HOST: 0.0.0.0
      ODM_MCP_PORT: 3006
      ODM_LATENCY_LOG: ${ODM_LATENCY_LOG:-}
      # Browser-origin requests are rejected unless explicitly allowlisted.
      # Native MCP clients normally do not send Origin and need no entry.
      ODM_MCP_ALLOWED_ORIGINS: ${ODM_MCP_ALLOWED_ORIGINS:-}
    ports:
      - "127.0.0.1:${ODM_MCP_PORT:-3006}:3006"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777

volumes:
  odm-data:
  odm-uploads:
  odm-generated:
  odm-audio:
