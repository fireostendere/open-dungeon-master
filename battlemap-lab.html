, and NPC states.":"\u0427\u0442\u043E \u043A\u0430\u0436\u0435\u0442\u0441\u044F \u043D\u0435\u0432\u0435\u0440\u043D\u044B\u043C? \u0421\u0435\u0440\u0432\u0435\u0440 \u0441\u0432\u0435\u0440\u0438\u0442 \u0444\u0440\u0430\u0433\u043C\u0435\u043D\u0442 \u0441\u043E \u0432\u0441\u0435\u043C\u0438 \u0437\u0430\u043F\u0438\u0441\u044F\u043C\u0438: \u0444\u0430\u043A\u0442\u0430\u043C\u0438, \u0430\u0440\u0445\u0438\u0432\u0430\u043C\u0438 \u0433\u043B\u0430\u0432, \u043F\u0440\u043E\u0448\u043B\u044B\u043C\u0438 \u0441\u0446\u0435\u043D\u0430\u043C\u0438 \u0438 \u0441\u043E\u0441\u0442\u043E\u044F\u043D\u0438\u044F\u043C\u0438 NPC.","Cross-referencing the record (queued behind the DM)...":"\u0421\u0432\u0435\u0440\u044F\u0435\u043C \u0441 \u0437\u0430\u043F\u0438\u0441\u044F\u043C\u0438 (\u0437\u0430\u043F\u0440\u043E\u0441 \u043E\u0436\u0438\u0434\u0430\u0435\u0442 \u043E\u0442\u0432\u0435\u0442\u0430 \u041C\u0430\u0441\u0442\u0435\u0440\u0430)\u2026",Evidence:"\u041E\u0431\u043E\u0441\u043D\u043E\u0432\u0430\u043D\u0438\u0435","Suggested rewrite":"\u041F\u0440\u0435\u0434\u043B\u0430\u0433\u0430\u0435\u043C\u0430\u044F \u043F\u0440\u0430\u0432\u043A\u0430","Applied; the message has been updated.":"\u041F\u0440\u0438\u043C\u0435\u043D\u0435\u043D\u043E: \u0441\u043E\u043E\u0431\u0449\u0435\u043D\u0438\u0435 \u043E\u0431\u043D\u043E\u0432\u043B\u0435\u043D\u043E.","Accept rewrite":"\u041F\u0440\u0438\u043D\u044F\u0442\u044C \u043F\u0440\u0430\u0432\u043A\u0443","Check a different category":"\u041F\u0440\u043E\u0432\u0435\u0440\u0438\u0442\u044C \u0434\u0440\u0443\u0433\u0443\u044E \u043A\u0430\u0442\u0435\u0433\u043E\u0440\u0438\u044E","Title (The Ashen League, The Sundering...)":"\u041D\u0430\u0437\u0432\u0430\u043D\u0438\u0435 (\u043D\u0430\u043F\u0440\u0438\u043C\u0435\u0440, \xAB\u041F\u0435\u043F\u0435\u043B\u044C\u043D\u044B\u0439 \u0441\u043E\u044E\u0437\xBB, \xAB\u0420\u0430\u0441\u043A\u043E\u043B\xBB\u2026) ","What is established about it... # Headings, **bold**, - lists, and [[The Mill]] to link another entry.":"\u0427\u0442\u043E \u043E \u043D\u0435\u0439 \u0438\u0437\u0432\u0435\u0441\u0442\u043D\u043E\u2026 \u0418\u0441\u043F\u043E\u043B\u044C\u0437\u0443\u0439\u0442\u0435 # \u0437\u0430\u0433\u043E\u043B\u043E\u0432\u043A\u0438, **\u043F\u043E\u043B\u0443\u0436\u0438\u0440\u043D\u044B\u0439 \u0442\u0435\u043A\u0441\u0442**, - \u0441\u043F\u0438\u0441\u043A\u0438 \u0438 [[\u041C\u0435\u043B\u044C\u043D\u0438\u0446\u0430]] \u0434\u043B\u044F \u0441\u0441\u044B\u043B\u043A\u0438 \u043D\u0430 \u0434\u0440\u0443\u0433\u0443\u044E \u0437\u0430\u043F\u0438\u0441\u044C.","Drops a [[link]] where the cursor is.":"\u0412\u0441\u0442\u0430\u0432\u043B\u044F\u0435\u0442 [[\u0441\u0441\u044B\u043B\u043A\u0443]] \u0432 \u043F\u043E\u0437\u0438\u0446\u0438\u044E \u043A\u0443\u0440\u0441\u043E\u0440\u0430.","Tags, comma separated (optional)":"\u0422\u0435\u0433\u0438 \u0447\u0435\u0440\u0435\u0437 \u0437\u0430\u043F\u044F\u0442\u0443\u044E (\u043D\u0435\u043E\u0431\u044F\u0437\u0430\u0442\u0435\u043B\u044C\u043D\u043E)","1. Entry hall":"1. \u0412\u0445\u043E\u0434\u043D\u043E\u0439 \u0437\u0430\u043B","Label text":"\u0422\u0435\u043A\u0441\u0442 \u043C\u0435\u0442\u043A\u0438","Only I see it":"\u0412\u0438\u0436\u0443 \u0442\u043E\u043B\u044C\u043A\u043E \u044F","Tap a tile to put the label there; tap a labelled tile to take it away. Players see the ones not marked for you, and only where they have been.":"\u041D\u0430\u0436\u043C\u0438\u0442\u0435 \u043D\u0430 \u043A\u043B\u0435\u0442\u043A\u0443, \u0447\u0442\u043E\u0431\u044B \u043F\u043E\u0441\u0442\u0430\u0432\u0438\u0442\u044C \u043C\u0435\u0442\u043A\u0443; \u043D\u0430\u0436\u043C\u0438\u0442\u0435 \u043D\u0430 \u043A\u043B\u0435\u0442\u043A\u0443 \u0441 \u043C\u0435\u0442\u043A\u043E\u0439, \u0447\u0442\u043E\u0431\u044B \u0443\u0431\u0440\u0430\u0442\u044C \u0435\u0451. \u0418\u0433\u0440\u043E\u043A\u0438 \u0432\u0438\u0434\u044F\u0442 \u0442\u043E\u043B\u044C\u043A\u043E \u043C\u0435\u0442\u043A\u0438 \u0431\u0435\u0437 \u043F\u043E\u043C\u0435\u0442\u043A\u0438 \xAB\u0442\u043E\u043B\u044C\u043A\u043E \u0434\u043B\u044F \u043C\u0435\u043D\u044F\xBB \u0438 \u043B\u0438\u0448\u044C \u0432 \u0443\u0436\u0435 \u0438\u0441\u0441\u043B\u0435\u0434\u043E\u0432\u0430\u043D\u043D\u044B\u0445 \u043C\u0435\u0441\u0442\u0430\u0445.","Prop name":"\u041D\u0430\u0437\u0432\u0430\u043D\u0438\u0435 \u043E\u0431\u044A\u0435\u043A\u0442\u0430","Furniture and bystanders go on the table with the map as the DM&apos;s own tokens; nothing in the rules can target them.":"\u041C\u0435\u0431\u0435\u043B\u044C \u0438 \u0441\u043B\u0443\u0447\u0430\u0439\u043D\u044B\u0435 \u043F\u0440\u043E\u0445\u043E\u0436\u0438\u0435 \u043E\u0442\u043E\u0431\u0440\u0430\u0436\u0430\u044E\u0442\u0441\u044F \u043D\u0430 \u043A\u0430\u0440\u0442\u0435 \u043A\u0430\u043A \u043E\u0442\u0434\u0435\u043B\u044C\u043D\u044B\u0435 \u043C\u0430\u0440\u043A\u0435\u0440\u044B \u041C\u0430\u0441\u0442\u0435\u0440\u0430: \u0438\u0433\u0440\u043E\u0432\u044B\u0435 \u043F\u0440\u0430\u0432\u0438\u043B\u0430 \u043D\u0435 \u043F\u043E\u0437\u0432\u043E\u043B\u044F\u044E\u0442 \u0432\u044B\u0431\u0438\u0440\u0430\u0442\u044C \u0438\u0445 \u0446\u0435\u043B\u044C\u044E.","What it sounds like":"\u041A\u0430\u043A \u044D\u0442\u043E \u0437\u0432\u0443\u0447\u0438\u0442","Ambient bed":"\u0424\u043E\u043D\u043E\u0432\u044B\u0439 \u0437\u0432\u0443\u043A","Leave the place sound alone":"\u041D\u0435 \u043C\u0435\u043D\u044F\u0442\u044C \u0437\u0432\u0443\u043A \u043C\u0435\u0441\u0442\u0430",Music:"\u041C\u0443\u0437\u044B\u043A\u0430","Leave the music alone":"\u041D\u0435 \u043C\u0435\u043D\u044F\u0442\u044C \u043C\u0443\u0437\u044B\u043A\u0443","Played when this map goes on the table.":"\u0417\u0432\u0443\u0447\u0438\u0442, \u043A\u043E\u0433\u0434\u0430 \u044D\u0442\u0430 \u043A\u0430\u0440\u0442\u0430 \u043F\u043E\u044F\u0432\u043B\u044F\u0435\u0442\u0441\u044F \u043D\u0430 \u0438\u0433\u0440\u043E\u0432\u043E\u043C \u0441\u0442\u043E\u043B\u0435.","Your own overlay":"\u0412\u0430\u0448\u0430 \u0437\u0430\u043C\u0435\u0442\u043A\u0430 \u043F\u043E\u0432\u0435\u0440\u0445 \u043A\u0430\u0440\u0442\u044B","Drawn over the map in the same register as the picture under it, for your eyes only: the version with the trap markings and the room numbers.":"\u0420\u0438\u0441\u0443\u0435\u0442\u0441\u044F \u043F\u043E\u0432\u0435\u0440\u0445 \u043A\u0430\u0440\u0442\u044B \u0432 \u0446\u0432\u0435\u0442\u0430\u0445 \u0438\u0441\u0445\u043E\u0434\u043D\u043E\u0433\u043E \u0438\u0437\u043E\u0431\u0440\u0430\u0436\u0435\u043D\u0438\u044F \u0438 \u0432\u0438\u0434\u043D\u0430 \u0442\u043E\u043B\u044C\u043A\u043E \u0432\u0430\u043C \u2014 \u043D\u0430\u043F\u0440\u0438\u043C\u0435\u0440, \u043D\u0430 \u0432\u0435\u0440\u0441\u0438\u0438 \u0441 \u043B\u043E\u0432\u0443\u0448\u043A\u0430\u043C\u0438 \u0438 \u043D\u043E\u043C\u0435\u0440\u0430\u043C\u0438 \u043A\u043E\u043C\u043D\u0430\u0442.","Undo (Ctrl+Z)":"\u041E\u0442\u043C\u0435\u043D\u0438\u0442\u044C (Ctrl+Z)","Redo (Ctrl+Shift+Z)":"\u041F\u043E\u0432\u0442\u043E\u0440\u0438\u0442\u044C (Ctrl+Shift+Z)","Light a tile":"\u041E\u0441\u0432\u0435\u0442\u0438\u0442\u044C \u043A\u043B\u0435\u0442\u043A\u0443","Put out all":"\u041F\u043E\u0433\u0430\u0441\u0438\u0442\u044C \u0432\u0441\u0451","Tap a tile to light it; tap a lit tile to put it out. Up to":"\u041D\u0430\u0436\u043C\u0438\u0442\u0435 \u043D\u0430 \u043A\u043B\u0435\u0442\u043A\u0443, \u0447\u0442\u043E\u0431\u044B \u043E\u0441\u0432\u0435\u0442\u0438\u0442\u044C \u0435\u0451; \u043D\u0430\u0436\u043C\u0438\u0442\u0435 \u043D\u0430 \u043E\u0441\u0432\u0435\u0449\u0451\u043D\u043D\u0443\u044E, \u0447\u0442\u043E\u0431\u044B \u043F\u043E\u0433\u0430\u0441\u0438\u0442\u044C. \u041D\u0430 \u043A\u0430\u0440\u0442\u0435 \u043C\u043E\u0436\u043D\u043E \u043F\u043E\u0441\u0442\u0430\u0432\u0438\u0442\u044C \u0434\u043E","on a map.":"\u0438\u0441\u0442\u043E\u0447\u043D\u0438\u043A\u043E\u0432 \u0441\u0432\u0435\u0442\u0430.","Tap a tile to pick up whatever brush painted it.":"\u041D\u0430\u0436\u043C\u0438\u0442\u0435 \u043D\u0430 \u043A\u043B\u0435\u0442\u043A\u0443, \u0447\u0442\u043E\u0431\u044B \u0432\u044B\u0431\u0440\u0430\u0442\u044C \u043A\u0438\u0441\u0442\u044C, \u043A\u043E\u0442\u043E\u0440\u043E\u0439 \u043E\u043D\u0430 \u043D\u0430\u0440\u0438\u0441\u043E\u0432\u0430\u043D\u0430.","Drag to move. Pinch or scroll to zoom; the corner buttons do the same.":"\u041F\u0435\u0440\u0435\u0442\u0430\u0441\u043A\u0438\u0432\u0430\u0439\u0442\u0435 \u043A\u0430\u0440\u0442\u0443, \u0447\u0442\u043E\u0431\u044B \u043F\u0435\u0440\u0435\u043C\u0435\u0441\u0442\u0438\u0442\u044C \u0435\u0451. \u0421\u0432\u0435\u0434\u0438\u0442\u0435 \u0438\u043B\u0438 \u0440\u0430\u0437\u0432\u0435\u0434\u0438\u0442\u0435 \u043F\u0430\u043B\u044C\u0446\u044B \u043B\u0438\u0431\u043E \u043F\u0440\u043E\u043A\u0440\u0443\u0442\u0438\u0442\u0435 \u043A\u043E\u043B\u0435\u0441\u043E \u0434\u043B\u044F \u043C\u0430\u0441\u0448\u0442\u0430\u0431\u0438\u0440\u043E\u0432\u0430\u043D\u0438\u044F; \u043A\u043D\u043E\u043F\u043A\u0438 \u0432 \u0443\u0433\u043B\u0443 \u0434\u0435\u043B\u0430\u044E\u0442 \u0442\u043E \u0436\u0435 \u0441\u0430\u043C\u043E\u0435.","Pick a tool. Keys 1 to 5 pick a brush, Escape puts the tool down, Ctrl+Z takes back the last edit.":"\u0412\u044B\u0431\u0435\u0440\u0438\u0442\u0435 \u0438\u043D\u0441\u0442\u0440\u0443\u043C\u0435\u043D\u0442. \u041A\u043B\u0430\u0432\u0438\u0448\u0438 1\u20135 \u0432\u044B\u0431\u0438\u0440\u0430\u044E\u0442 \u043A\u0438\u0441\u0442\u044C, Escape \u043E\u0442\u043A\u043B\u044E\u0447\u0430\u0435\u0442 \u0438\u043D\u0441\u0442\u0440\u0443\u043C\u0435\u043D\u0442, Ctrl+Z \u043E\u0442\u043C\u0435\u043D\u044F\u0435\u0442 \u043F\u043E\u0441\u043B\u0435\u0434\u043D\u0435\u0435 \u0438\u0437\u043C\u0435\u043D\u0435\u043D\u0438\u0435.","Paint the ground":"\u0420\u0438\u0441\u043E\u0432\u0430\u0442\u044C \u043F\u043E\u0432\u0435\u0440\u0445\u043D\u043E\u0441\u0442\u044C","Stamp a shape":"\u041F\u043E\u0441\u0442\u0430\u0432\u0438\u0442\u044C \u0444\u0438\u0433\u0443\u0440\u0443","Click once on the map. The outline shows where it will land.":"\u041D\u0430\u0436\u043C\u0438\u0442\u0435 \u043D\u0430 \u043A\u0430\u0440\u0442\u0443 \u043E\u0434\u0438\u043D \u0440\u0430\u0437. \u041A\u043E\u043D\u0442\u0443\u0440 \u043F\u043E\u043A\u0430\u0436\u0435\u0442, \u0433\u0434\u0435 \u043F\u043E\u044F\u0432\u0438\u0442\u0441\u044F \u0444\u0438\u0433\u0443\u0440\u0430.","Rooms and corridors in one click, drawn in the same five tiles the rules read.":"\u041A\u043E\u043C\u043D\u0430\u0442\u044B \u0438 \u043A\u043E\u0440\u0438\u0434\u043E\u0440\u044B \u043E\u0434\u043D\u0438\u043C \u043D\u0430\u0436\u0430\u0442\u0438\u0435\u043C, \u0441 \u0442\u0435\u043C\u0438 \u0436\u0435 \u0440\u0430\u0437\u043C\u0435\u0440\u0430\u043C\u0438 \u043A\u043B\u0435\u0442\u043E\u043A, \u0447\u0442\u043E \u0438\u0441\u043F\u043E\u043B\u044C\u0437\u0443\u044E\u0442\u0441\u044F \u0432 \u043F\u0440\u0430\u0432\u0438\u043B\u0430\u0445.","Picture under the grid":"\u0418\u0437\u043E\u0431\u0440\u0430\u0436\u0435\u043D\u0438\u0435 \u043F\u043E\u0434 \u0441\u0435\u0442\u043A\u043E\u0439",Across:"\u0428\u0438\u0440\u0438\u043D\u0430",Down:"\u0412\u044B\u0441\u043E\u0442\u0430",Strength:"\u0421\u0438\u043B\u0430","The picture is scenery. The walls that stop a rogue are the ones painted into the terrain, so line the two up and check them before anyone plays on it.":"\u041A\u0430\u0440\u0442\u0438\u043D\u043A\u0430 \u2014 \u0442\u043E\u043B\u044C\u043A\u043E \u0444\u043E\u043D. \u041F\u043B\u0443\u0442\u043E\u0432 \u043E\u0441\u0442\u0430\u043D\u0430\u0432\u043B\u0438\u0432\u0430\u044E\u0442 \u0441\u0442\u0435\u043D\u044B, \u043D\u0430\u0440\u0438\u0441\u043E\u0432\u0430\u043D\u043D\u044B\u0435 \u043D\u0430 \u0440\u0435\u043B\u044C\u0435\u0444\u0435, \u043F\u043E\u044D\u0442\u043E\u043C\u0443 \u0441\u043E\u0432\u043C\u0435\u0441\u0442\u0438\u0442\u0435 \u0441\u043B\u043E\u0438 \u0438 \u043F\u0440\u043E\u0432\u0435\u0440\u044C\u0442\u0435 \u043A\u0430\u0440\u0442\u0443 \u0434\u043E \u043D\u0430\u0447\u0430\u043B\u0430 \u0438\u0433\u0440\u044B.",Bite:"\u0423\u043A\u0443\u0441","to hit":"\u043A \u043F\u043E\u043F\u0430\u0434\u0430\u043D\u0438\u044E",slashing:"\u0440\u0443\u0431\u044F\u0449\u0438\u0439",Attack:"\u0410\u0442\u0430\u043A\u0430","The engine picks one attack and swings it as many times as the multiattack allows, capped at three. Damage has to be something the dice roller can read.":"\u0414\u0432\u0438\u0436\u043E\u043A \u0432\u044B\u0431\u0438\u0440\u0430\u0435\u0442 \u043E\u0434\u043D\u0443 \u0430\u0442\u0430\u043A\u0443 \u0438 \u043F\u043E\u0432\u0442\u043E\u0440\u044F\u0435\u0442 \u0435\u0451 \u0441\u0442\u043E\u043B\u044C\u043A\u043E \u0440\u0430\u0437, \u0441\u043A\u043E\u043B\u044C\u043A\u043E \u0440\u0430\u0437\u0440\u0435\u0448\u0430\u0435\u0442 \u043C\u0443\u043B\u044C\u0442\u0438\u0430\u0442\u0430\u043A\u0430, \u043D\u043E \u043D\u0435 \u0431\u043E\u043B\u0435\u0435 \u0442\u0440\u0451\u0445. \u0423\u0440\u043E\u043D \u043D\u0443\u0436\u043D\u043E \u0437\u0430\u043F\u0438\u0441\u0430\u0442\u044C \u0432 \u0444\u043E\u0440\u043C\u0430\u0442\u0435, \u043F\u043E\u043D\u044F\u0442\u043D\u043E\u043C \u0431\u0440\u043E\u0441\u043A\u0443 \u043A\u043E\u0441\u0442\u0435\u0439.","Fire Breath (Recharge 5-6): DC 15 Dex save, 6d6 fire, half on a success":"\u041E\u0433\u043D\u0435\u043D\u043D\u043E\u0435 \u0434\u044B\u0445\u0430\u043D\u0438\u0435 (\u043F\u0435\u0440\u0435\u0437\u0430\u0440\u044F\u0434\u043A\u0430 5\u20136): \u0441\u043F\u0430\u0441\u0431\u0440\u043E\u0441\u043E\u043A \u041B\u043E\u0432\u043A\u043E\u0441\u0442\u0438 \u0421\u043B 15, \u0443\u0440\u043E\u043D \u043E\u0433\u043D\u0451\u043C 6\u043A6, \u043F\u043E\u043B\u043E\u0432\u0438\u043D\u0430 \u043F\u0440\u0438 \u0443\u0441\u043F\u0435\u0445\u0435","Remove trait":"\u0423\u0434\u0430\u043B\u0438\u0442\u044C \u043E\u0441\u043E\u0431\u0435\u043D\u043D\u043E\u0441\u0442\u044C","Trait, legendary action or lair action":"\u041E\u0441\u043E\u0431\u0435\u043D\u043D\u043E\u0441\u0442\u044C, \u043B\u0435\u0433\u0435\u043D\u0434\u0430\u0440\u043D\u043E\u0435 \u0434\u0435\u0439\u0441\u0442\u0432\u0438\u0435 \u0438\u043B\u0438 \u0434\u0435\u0439\u0441\u0442\u0432\u0438\u0435 \u043B\u043E\u0433\u043E\u0432\u0430",Type:"\u0422\u0438\u043F","Your own; click to remove":"\u0421\u0432\u043E\u0451; \u043D\u0430\u0436\u043C\u0438\u0442\u0435, \u0447\u0442\u043E\u0431\u044B \u0443\u0434\u0430\u043B\u0438\u0442\u044C","or type your own, comma separated":"\u0438\u043B\u0438 \u0432\u0432\u0435\u0434\u0438\u0442\u0435 \u0441\u0432\u043E\u0438 \u0437\u043D\u0430\u0447\u0435\u043D\u0438\u044F \u0447\u0435\u0440\u0435\u0437 \u0437\u0430\u043F\u044F\u0442\u0443\u044E","Reads as &quot;":"\u041E\u0442\u043E\u0431\u0440\u0430\u0436\u0430\u0435\u0442\u0441\u044F \u043A\u0430\u043A \xAB","&quot;. Zero hides a mode.":"\xBB. \u041D\u043E\u043B\u044C \u0441\u043A\u0440\u044B\u0432\u0430\u0435\u0442 \u0440\u0435\u0436\u0438\u043C.","Build it out of the catalogue":"\u0421\u043E\u0431\u0435\u0440\u0438\u0442\u0435 \u0438\u0437 \u043A\u0430\u0442\u0430\u043B\u043E\u0433\u0430","Everything these add is an ordinary line on the block below: rename it, retune the numbers, or delete it. Mix as many classes as you like.":"\u0414\u043E\u0431\u0430\u0432\u043B\u0435\u043D\u043D\u044B\u0435 \u043F\u0430\u0440\u0430\u043C\u0435\u0442\u0440\u044B \u0441\u0442\u0430\u043D\u0443\u0442 \u043E\u0431\u044B\u0447\u043D\u044B\u043C\u0438 \u0441\u0442\u0440\u043E\u043A\u0430\u043C\u0438 \u0431\u043B\u043E\u043A\u0430 \u043D\u0438\u0436\u0435: \u043F\u0435\u0440\u0435\u0438\u043C\u0435\u043D\u0443\u0439\u0442\u0435 \u0438\u0445, \u0438\u0437\u043C\u0435\u043D\u0438\u0442\u0435 \u0437\u043D\u0430\u0447\u0435\u043D\u0438\u044F \u0438\u043B\u0438 \u0443\u0434\u0430\u043B\u0438\u0442\u0435. \u041C\u043E\u0436\u043D\u043E \u0441\u043E\u0447\u0435\u0442\u0430\u0442\u044C \u0441\u043A\u043E\u043B\u044C\u043A\u043E \u0443\u0433\u043E\u0434\u043D\u043E \u043A\u043B\u0430\u0441\u0441\u043E\u0432.",Ancestry:"\u041F\u0440\u043E\u0438\u0441\u0445\u043E\u0436\u0434\u0435\u043D\u0438\u0435","Take its size, speed and traits":"\u0418\u0441\u043F\u043E\u043B\u044C\u0437\u043E\u0432\u0430\u0442\u044C \u0435\u0433\u043E \u0440\u0430\u0437\u043C\u0435\u0440, \u0441\u043A\u043E\u0440\u043E\u0441\u0442\u044C \u0438 \u043E\u0441\u043E\u0431\u0435\u043D\u043D\u043E\u0441\u0442\u0438",Subclass:"\u041F\u043E\u0434\u043A\u043B\u0430\u0441\u0441","Take its hit points, saves and swings":"\u0418\u0441\u043F\u043E\u043B\u044C\u0437\u043E\u0432\u0430\u0442\u044C \u0435\u0433\u043E \u0445\u0438\u0442\u044B, \u0441\u043F\u0430\u0441\u0431\u0440\u043E\u0441\u043A\u0438 \u0438 \u0430\u0442\u0430\u043A\u0438","Its abilities at that level":"\u0415\u0433\u043E \u0443\u043C\u0435\u043D\u0438\u044F \u043D\u0430 \u044D\u0442\u043E\u043C \u0443\u0440\u043E\u0432\u043D\u0435",Unarmoured:"\u0411\u0435\u0437 \u0434\u043E\u0441\u043F\u0435\u0445\u0430",Shield:"\u0429\u0438\u0442","Set the armour class":"\u0417\u0430\u0434\u0430\u0442\u044C \u043A\u043B\u0430\u0441\u0441 \u0434\u043E\u0441\u043F\u0435\u0445\u0430","Ability mod":"\u041C\u043E\u0434\u0438\u0444\u0438\u043A\u0430\u0442\u043E\u0440 \u0445\u0430\u0440\u0430\u043A\u0442\u0435\u0440\u0438\u0441\u0442\u0438\u043A\u0438","To hit +":"\u0411\u043E\u043D\u0443\u0441 \u043A \u043F\u043E\u043F\u0430\u0434\u0430\u043D\u0438\u044E +","Search monsters to add: goblin, owlbear, the boss you built...":"\u041D\u0430\u0439\u0434\u0438\u0442\u0435 \u0447\u0443\u0434\u043E\u0432\u0438\u0449\u0435 \u0434\u043B\u044F \u0434\u043E\u0431\u0430\u0432\u043B\u0435\u043D\u0438\u044F: \u0433\u043E\u0431\u043B\u0438\u043D, \u043C\u0435\u0434\u0432\u0435\u0434\u043E\u0441\u044B\u0447 \u0438\u043B\u0438 \u0441\u043E\u0437\u0434\u0430\u043D\u043D\u044B\u0439 \u0432\u0430\u043C\u0438 \u0431\u043E\u0441\u0441\u2026","These drift on their own as the party treats them well or badly. Neither is a real answer, and most people are unremarkable on most of it.":"\u042D\u0442\u0438 \u0437\u043D\u0430\u0447\u0435\u043D\u0438\u044F \u043C\u0435\u043D\u044F\u044E\u0442\u0441\u044F, \u043A\u043E\u0433\u0434\u0430 \u043E\u0442\u0440\u044F\u0434 \u043E\u0431\u0440\u0430\u0449\u0430\u0435\u0442\u0441\u044F \u0441 \u043F\u0435\u0440\u0441\u043E\u043D\u0430\u0436\u0435\u043C \u0445\u043E\u0440\u043E\u0448\u043E \u0438\u043B\u0438 \u043F\u043B\u043E\u0445\u043E. \u042D\u0442\u043E \u043D\u0435 \u0441\u0442\u0440\u043E\u0433\u0438\u0435 \u043E\u0442\u0432\u0435\u0442\u044B, \u0430 \u0431\u043E\u043B\u044C\u0448\u0438\u043D\u0441\u0442\u0432\u043E \u043B\u044E\u0434\u0435\u0439 \u0432 \u0431\u043E\u043B\u044C\u0448\u0438\u043D\u0441\u0442\u0432\u0435 \u0441\u043B\u0443\u0447\u0430\u0435\u0432 \u043E\u0441\u0442\u0430\u044E\u0442\u0441\u044F \u043E\u0431\u044B\u0447\u043D\u044B\u043C\u0438.",why:"\u043F\u043E\u0447\u0435\u043C\u0443","nobody by that name yet":"\u043F\u0435\u0440\u0441\u043E\u043D\u0430\u0436\u0430 \u0441 \u0442\u0430\u043A\u0438\u043C \u0438\u043C\u0435\u043D\u0435\u043C \u043F\u043E\u043A\u0430 \u043D\u0435\u0442","they say":"\u043E\u043D\u0438 \u0433\u043E\u0432\u043E\u0440\u044F\u0442","one-sided":"\u043E\u0434\u043D\u043E\u0441\u0442\u043E\u0440\u043E\u043D\u043D\u044F\u044F","The DM rarely spells a name the same way twice over fifty turns. Close matches are flagged here rather than merged for you, because two similar names are often two people. Merging keeps the old spelling as an alias, so nothing already written stops resolving.":"\u0417\u0430 \u043F\u044F\u0442\u044C\u0434\u0435\u0441\u044F\u0442 \u0445\u043E\u0434\u043E\u0432 \u041C\u0430\u0441\u0442\u0435\u0440 \u043C\u043E\u0436\u0435\u0442 \u043D\u0430\u043F\u0438\u0441\u0430\u0442\u044C \u043E\u0434\u043D\u043E \u0438\u043C\u044F \u043F\u043E-\u0440\u0430\u0437\u043D\u043E\u043C\u0443. \u041F\u043E\u0445\u043E\ \u0411\u0443\u0434\u0435\u0442 \u0438\u0441\u043F\u043E\u043B\u044C\u0437\u043E\u0432\u0430\u043D\u043E \u0434\u043B\u044F \u0441\u043E\u0437\u0434\u0430\u043D\u0438\u044F \u043F\u043E\u0440\u0442\u0440\u0435\u0442\u0430, \u0435\u0441\u043B\u0438 \u0432\u044B \u043D\u0435 \u0437\u0430\u0433\u0440\u0443\u0437\u0438\u0442\u0435 \u0444\u043E\u0442\u043E\u0433\u0440\u0430\u0444\u0438\u044E.","How your character looks, for the party and the DM to picture.":"\u0412\u043D\u0435\u0448\u043D\u043E\u0441\u0442\u044C \u043F\u0435\u0440\u0441\u043E\u043D\u0430\u0436\u0430, \u0447\u0442\u043E\u0431\u044B \u043E\u0442\u0440\u044F\u0434 \u0438 \u043C\u0430\u0441\u0442\u0435\u0440 \u043C\u043E\u0433\u043B\u0438 \u0435\u0433\u043E \u043F\u0440\u0435\u0434\u0441\u0442\u0430\u0432\u0438\u0442\u044C.","(pinned)":"(\u0437\u0430\u043A\u0440\u0435\u043F\u043B\u0435\u043D\u043E)","Thornwick Ashvale":"\u0422\u043E\u0440\u043D\u0432\u0438\u043A \u042D\u0448\u0432\u0435\u0439\u043B","Companions are offered when a party adds one, at whatever level that table plays at. Nobody has to roll them up again.":"\u0421\u043E\u043F\u0430\u0440\u0442\u0438\u0439\u0446\u044B \u0441\u043E\u0437\u0434\u0430\u044E\u0442\u0441\u044F \u043D\u0430 \u0442\u0435\u043A\u0443\u0449\u0435\u043C \u0443\u0440\u043E\u0432\u043D\u0435 \u043E\u0442\u0440\u044F\u0434\u0430 \u2014 \u043F\u043E\u0432\u0442\u043E\u0440\u043D\u043E \u043F\u043E\u0432\u044B\u0448\u0430\u0442\u044C \u0438\u0445 \u043D\u0435 \u043F\u0440\u0438\u0434\u0451\u0442\u0441\u044F.","Joins a campaign as yours to control.":"\u041F\u0440\u0438\u0441\u043E\u0435\u0434\u0438\u043D\u0438\u0442\u0441\u044F \u043A \u043A\u0430\u043C\u043F\u0430\u043D\u0438\u0438 \u043F\u043E\u0434 \u0432\u0430\u0448\u0438\u043C \u0443\u043F\u0440\u0430\u0432\u043B\u0435\u043D\u0438\u0435\u043C.",Grants:"\u0414\u0430\u0451\u0442","What your character did before adventuring.":"\u0427\u0435\u043C \u043F\u0435\u0440\u0441\u043E\u043D\u0430\u0436 \u0437\u0430\u043D\u0438\u043C\u043 ,"Move {name} up the order":"\u041F\u043E\u0434\u043D\u044F\u0442\u044C {name} \u0432\u044B\u0448\u0435 \u0432 \u043F\u043E\u0440\u044F\u0434\u043A\u0435","Move {name} down the order":"\u041E\u043F\u0443\u0441\u0442\u0438\u0442\u044C {name} \u043D\u0438\u0436\u0435 \u0432 \u043F\u043E\u0440\u044F\u0434\u043A\u0435","Delay {name} to the bottom of the round":"\u041F\u0435\u0440\u0435\u043D\u0435\u0441\u0442\u0438 {name} \u0432 \u043A\u043E\u043D\u0435\u0446 \u0440\u0430\u0443\u043D\u0434\u0430","Take {name} out of the order":"\u0423\u0431\u0440\u0430\u0442\u044C {name} \u0438\u0437 \u043F\u043E\u0440\u044F\u0434\u043A\u0430","Creatures in this fight: {count}":"\u041F\u0440\u043E\u0442\u0438\u0432\u043D\u0438\u043A\u043E\u0432 \u0432 \u0431\u043E\u044E: {count}","\xB7 also sent to {names}":"\xB7 \u0442\u0430\u043A\u0436\u0435 \u043E\u0442\u043F\u0440\u0430\u0432\u043B\u0435\u043D\u043E: {names}","The numbers agree: CR {cr}.":"\u0427\u0438\u0441\u043B\u0430 \u043F\u043E\u0434\u0442\u0432\u0435\u0440\u0436\u0434\u0430\u044E\u0442 \u0440\u0435\u0439\u0442\u0438\u043D\u0433 \u043E\u043F\u0430\u0441\u043D\u043E\u0441\u0442\u0438: {cr}.","Written as CR {stated}; the numbers say CR {derived}.":"\u0423\u043A\u0430\u0437\u0430\u043D \u0440\u0435\u0439\u0442\u0438\u043D\u0433 \u043E\u043F\u0430\u0441\u043D\u043E\u0441\u0442\u0438 {stated}, \u043D\u043E \u043F\u043E \u0447\u0438\u0441\u043B\u0430\u043C \u043F\u043E\u043B\u0443\u0447\u0430\u0435\u0442\u0441\u044F {derived}.","Gained at level {level}":"\u041F\u043E\u043B\u0443\u0447\u0435\u043D\u043E \u043D\u0430 {level}-\u043C \u0443\u0440\u043E\u0432\u043D\u0435","Rename {name}":"\u041F\u0435\u0440\u0435\u0438\u043C\u0435\u043D\u043E\u0432\u0430\u0442\u044C: {name}","{count} public notes for {name}":"\u041E\u0442\u043A\u0440\u044B\u0442\u044B\u0445 \u0437\u0430\u043C\u0435\u0442\u043E\u043A \u043E {name}: {count}","Wild Shaped: damage hits the beast's hit points first. {name}'s own {current}/{max} waits for them when the form breaks.":"\u041F\u0440\u0438 \u0414\u0438\u043A\u043E\u043C \u043E\u0431\u043B\u0438\u043A\u0435 \u0443\u0440\u043E\u043D \u0441\u043D\u0430\u0447\u0430\u043B\u0430 \u043F\u043E\u043B\u0443\u0447\u0430\u0435\u0442 \u0437\u0432\u0435\u0440\u044C. \u041A\u043E\u0433\u0434\u0430 \u043E\u0431\u043B\u0438\u043A \u0440\u0430\u0441\u0441\u0435\u0435\u0442\u0441\u044F, \u0443 {name} \u043E\u0441\u0442\u0430\u043D\u0435\u0442\u0441\u044F {current}/{max} \u0441\u043E\u0431\u0441\u0442\u0432\u0435\u043D\u043D\u044B\u0445 \u0445\u0438\u0442\u043E\u0432.","Beast form hit points. {name}'s own: {current}/{max}":"\u0425\u0438\u0442\u044B \u0432 \u043E\u0431\u043B\u0438\u043A\u0435 \u0437\u0432\u0435\u0440\u044F. \u0421\u043E\u0431\u0441\u0442\u0432\u0435\u043D\u043D\u044B\u0435 \u0445\u0438\u0442\u044B {name}: {current}/{max}","The beast form's armor class; {name}'s own is {ac}.":"\u041A\u043B\u0430\u0441\u0441 \u0434\u043E\u0441\u043F\u0435\u0445\u0430 \u0432 \u043E\u0431\u043B\u0438\u043A\u0435 \u0437\u0432\u0435\u0440\u044F; \u0441\u043E\u0431\u0441\u0442\u0432\u0435\u043D\u043D\u044B\u0439 \u041A\u0414 {name}: {ac}.","Expertise (pick {count})":"\u041A\u043E\u043C\u043F\u0435\u0442\u0435\u043D\u0442\u043D\u043E\u0441\u0442\u044C (\u0432\u044B\u0431\u0435\u0440\u0438\u0442\u0435: {count})","Fighting style (pick {count})":"\u0411\u043E\u0435\u0432\u043E\u0439 \u0441\u0442\u0438\u043B\u044C (\u0432\u044B\u0431\u0435\u0440\u0438\u0442\u0435: {count})","What this is called":"\u041A\u0430\u043A \u044D\u0442\u043E \u043D\u0430\u0437\u044B\u0432\u0430\u0435\u0442\u0441\u044F","Each creature in a 15-foot cone must make a Dexterity saving throw, taking 3d6 fire damage on a failed save, or half as much on a successful one.":"\u041A\u0430\u0436\u0434\u043E\u0435 \u0441\u0443\u0449\u0435\u0441\u0442\u0432\u043E \u0432 \u043A\u043E\u043D\u0443\u0441\u0435 \u0434\u043B\u0438\u043D\u043E\u0439 4,5 \u043C \u0434\u043E\u043B\u0436\u043D\u043E \u0441\u043E\u0432\u0435\u0440\u0448\u0438\u0442\u044C \u0441\u043F\u0430\u0441\u0431\u0440\u043E\u0441\u043E\u043A \u041B\u043E\u0432\u043A\u043E\u0441\u0442\u0438: \u043F\u0440\u0438 \u043F\u0440\u043E\u0432\u0430\u043B\u0435 \u043E\u043D\u043E \u043F\u043E\u043B\u0443\u0447\u0430\u0435\u0442 3\u043A6 \u0443\u0440\u043E\u043D\u0430 \u043E\u0433\u043D\u0451\u043C, \u043F\u0440\u0438 \u0443\u0441\u043F\u0435\u0445\u0435 \u2014 \u043F\u043E\u043B\u043E\u0432\u0438\u043D\u0443.","What it is, in the words the players will read.":"\u041A\u0440\u0430\u0442\u043A\u043E \u043E\u043F\u0438\u0448\u0438\u0442\u0435 \u044D\u0442\u043E \u0442\u0430\u043A, \u043A\u0430\u043A \u043E\u043F\u0438\u0441\u0430\u043D\u0438\u0435 \u0443\u0432\u0438\u0434\u044F\u0442 \u0438\u0433\u0440\u043E\u043A\u0438.","The engine reads the damage, the save and the damage type out of this.":"\u0414\u0432\u0438\u0436\u043E\u043A \u0438\u0437\u0432\u043B\u0435\u043A\u0430\u0435\u0442 \u0438\u0437 \u044D\u0442\u043E\u0433\u043E \u0442\u0435\u043A\u0441\u0442\u0430 \u0443\u0440\u043E\u043D, \u0441\u043F\u0430\u0441\u0431\u0440\u043E\u0441\u043E\u043A \u0438 \u0435\u0433\u043E \u0442\u0438\u043F.","Enlarge image: {label}":"\u0423\u0432\u0435\u043B\u0438\u0447\u0438\u0442\u044C \u0438\u0437\u043E\u0431\u0440\u0430\u0436\u0435\u043D\u0438\u0435: {label}","What is {label}?":"\u0427\u0442\u043E \u0442\u0430\u043A\u043E\u0435 \xAB{label}\xBB?","Nothing by this name yet":"\u041F\u043E\u043A\u0430 \u043D\u0438\u0447\u0435\u0433\u043E \u043D\u0435 \u043D\u0430\u0439\u0434\u0435\u043D\u043E \u043F\u043E \u044D\u0442\u043E\u043C\u0443 \u043D\u0430\u0437\u0432\u0430\u043D\u0438\u044E","Remove {value}":"\u0423\u0431\u0440\u0430\u0442\u044C: {value}","Level {level}":"\u0423\u0440\u043E\u0432\u0435\u043D\u044C {level}","Placed: {count}. Up to {limit}.":"\u0420\u0430\u0437\u043C\u0435\u0449\u0435\u043D\u043E: {count}. \u041C\u0430\u043A\u0441\u0438\u043C\u0443\u043C: {limit}.","The game pauses on your rolls and asks for your real dice results. Click to switch back to automatic digital rolls.":"\u0418\u0433\u0440\u0430 \u0436\u0434\u0451\u0442 \u0440\u0435\u0437\u0443\u043B\u044C\u0442\u0430\u0442\u043E\u0432 \u0432\u0430\u0448\u0438\u0445 \u0431\u0440\u043E\u0441\u043A\u043E\u0432 \u043D\u0430 \u043D\u0430\u0441\u0442\u043E\u044F\u0449\u0438\u0445 \u043A\u043E\u0441\u0442\u044F\u0445. \u041D\u0430\u0436\u043C\u0438\u0442\u0435, \u0447\u0442\u043E\u0431\u044B \u0432\u0435\u0440\u043D\u0443\u0442\u044C\u0441\u044F \u043A \u0430\u0432\u0442\u043E\u043C\u0430\u0442\u0438\u0447\u0435\u0441\u043A\u0438\u043C \u0432\u0438\u0440\u0442\u0443\u0430\u043B\u044C\u043D\u044B\u043C \u0431\u0440\u043E\u0441\u043A\u0430\u043C.","Roll your own physical dice: the game will tell you what to roll and wait for your result. Click to opt in.":"\u0411\u0440\u043E\u0441\u0430\u0439\u0442\u0435 \u043D\u0430\u0441\u0442\u043E\u044F\u0449\u0438\u0435 \u043A\u043E\u0441\u0442\u0438: \u0438\u0433\u0440\u0430 \u043F\u043E\u0434\u0441\u043A\u0430\u0436\u0435\u0442, \u043A\u0430\u043A\u0438\u0435 \u0431\u0440\u043E\u0441\u043A\u0438 \u043D\u0443\u0436\u043D\u044B, \u0438 \u0431\u0443\u0434\u0435\u0442 \u0436\u0434\u0430\u0442\u044C \u0440\u0435\u0437\u0443\u043B\u044C\u0442\u0430\u0442. \u041D\u0430\u0436\u043C\u0438\u0442\u0435, \u0447\u0442\u043E\u0431\u044B \u0432\u043A\u043B\u044E\u0447\u0438\u0442\u044C \u044D\u0442\u043E\u0442 \u0440\u0435\u0436\u0438\u043C.","{name}'s portrait":"\u041F\u043E\u0440\u0442\u0440\u0435\u0442 \u043F\u0435\u0440\u0441\u043E\u043D\u0430\u0436\u0430 \xAB{name}\xBB","Roll {dice} at your table and enter each die below.{modifier} The game waits for your result.":"\u0411\u0440\u043E\u0441\u044C\u0442\u0435 {dice} \u0437\u0430 \u0441\u0442\u043E\u043B\u043E\u043C \u0438 \u0432\u0432\u0435\u0434\u0438\u0442\u0435 \u0437\u043D\u0430\u0447\u0435\u043D\u0438\u044F \u043A\u043E\u0441\u0442\u0435\u0439 \u043D\u0438\u0436\u0435.{modifier} \u0418\u0433\u0440\u0430 \u0436\u0434\u0451\u0442 \u0432\u0430\u0448 \u0440\u0435\u0437\u0443\u043B\u044C\u0442 E\u043C \u0441\u0435\u0440\u0432\u0435\u0440\u0435.","Voice chat":"\u0413\u043E\u043B\u043E\u0441\u043E\u0432\u043E\u0439 \u0447\u0430\u0442","Browser-to-browser mesh or the built-in mediasoup SFU. This is ordinary WebRTC voice, not speech AI.":"\u041F\u0440\u044F\u043C\u043E\u0435 \u0441\u043E\u0435\u0434\u0438\u043D\u0435\u043D\u0438\u0435 \u043C\u0435\u0436\u0434\u0443 \u0431\u0440\u0430\u0443\u0437\u0435\u0440\u0430\u043C\u0438 \u0438\u043B\u0438 \u0432\u0441\u0442\u0440\u043E\u0435\u043D\u043D\u044B\u0439 SFU mediasoup. \u042D\u0442\u043E \u043E\u0431\u044B\u0447\u043D\u0430\u044F \u0433\u043E\u043B\u043E\u0441\u043E\u0432\u0430\u044F \u0441\u0432\u044F\u0437\u044C \u043F\u043E WebRTC, \u043D\u0435 \u0440\u0435\u0447\u0435\u0432\u043E\u0439 \u0418\u0418.","Discord sign-in":"\u0412\u0445\u043E\u0434 \u0447\u0435\u0440\u0435\u0437 Discord","A secret is already configured; leave blank to keep it.":"\u0421\u0435\u043A\u0440\u0435\u0442 \u0443\u0436\u0435 \u043D\u0430\u0441\u0442\u0440\u043E\u0435\u043D. \u041E\u0441\u0442\u0430\u0432\u044C\u0442\u0435 \u043F\u043E\u043B\u0435 \u043F\u0443\u0441\u0442\u044B\u043C, \u0447\u0442\u043E\u0431\u044B \u0441\u043E\u0445\u0440\u0430\u043D\u0438\u0442\u044C \u0435\u0433\u043E.","Device-hosted world":"\u041C\u0438\u0440 \u043D\u0430 \u0443\u0441\u0442\u0440\u043E\u0439\u0441\u0442\u0432\u0435","Signup, transport and account-provider settings are owned by the desktop/mobile host.":"\u0420\u0435\u0433\u0438\u0441\u0442\u0440\u0430\u0446\u0438\u0435\u0439, \u043F\u043E\u0434\u043A\u043B\u044E\u0447\u0435\u043D\u0438\u0435\u043C \u0438 \u0443\u0447\u0451\u0442\u043D\u044B\u043C\u0438 \u0437\u0430\u043F\u0438\u0441\u044F\u043C\u0438 \u0443\u043F\u0440\u0430\u0432\u043B\u044F\u0435\u0442 \u043F\u0440\u0438\u043B\u043E\u0436\u0435\u043D\u0438\u0435 \u043D\u0430 \u043A\u043E\u043C\u043F\u044C\u044E\u0442\u0435\u0440\u0435 \u0438\u043B\u0438 \u043C\u043E\u0431\u0438\u043B\u044C\u043D\u043E\u043C \u0443\u0441\u0442\u0440\u043E\u0439\u0441\u0442\u0432\u0435.","Who were they before the adventure? The party can read this, and the DM weaves it into the story.":"\u041A\u0435\u043C \u043F\u0435\u0440\u0441\u043E\u043D\u0430\u0436 \u0431\u044B\u043B \u0434\u043E \u043F\u0440\u0438\u043A\u043B\u044E\u0447\u0435\u043D\u0438\u0439? \u041E\u0442\u0440\u044F\u0434 \u0441\u043C\u043E\u0436\u0435\u0442 \u043F\u0440\u043E\u0447\u0438\u0442\u0430\u0442\u044C \u044D\u0442\u043E, \u0430 \u041C\u0430\u0441\u0442\u0435\u0440 \u0432\u043F\u043B\u0435\u0442\u0451\u0442 \u0438\u0441\u0442\u043E\u0440\u0438\u044E \u0432 \u0441\u044E\u0436\u0435\u0442.","Beyond the ability score improvement picks on the Abilities step; racial or homebrew feats go here.":"\u0412 \u0434\u043E\u043F\u043E\u043B\u043D\u0435\u043D\u0438\u0435 \u043A \u043F\u043E\u0432\u044B\u0448\u0435\u043D\u0438\u044E \u0445\u0430\u0440\u0430\u043A\u0442\u0435\u0440\u0438\u0441\u0442\u0438\u043A \u043D\u0430 \u0448\u0430\u0433\u0435 \xAB\u0425\u0430\u0440\u0430\u043A\u0442\u0435\u0440\u0438\u0441\u0442\u0438\u043A\u0438\xBB; \u0437\u0434\u0435\u0441\u044C \u043C\u043E\u0436\u043D\u043E \u0432\u044B\u0431\u0440\u0430\u0442\u044C \u0440\u0430\u0441\u043E\u0432\u044B\u0435 \u0447\u0435\u0440\u0442\u044B \u0438 \u0432\u0430\u0440\u0438\u0430\u043D\u0442\u044B \u0445\u043E\u0443\u043C\u0431\u0440\u044E.","Slashing, piercing and bludgeoning are the weapon types; the rest are for enchanted blades.":"\u0420\u0443\u0431\u044F\u0449\u0438\u0439, \u043A\u043E\u043B\u044E\u0449\u0438\u0439 \u0438 \u0434\u0440\u043E\u0431\u044F\u0449\u0438\u0439 \u2014 \u0442\u0438\u043F\u044B \u0443\u0440\u043E\u043D\u0430 \u043E\u0440\u0443\u0436\u0438\u044F; \u043E\u0441\u0442\u0430\u043B\u044C\u043D\u044B\u0435 \u043F\u043E\u0434\u0445\u043E\u0434\u044F\u0442 \u0434\u043B\u044F \u0437\u0430\u0447\u0430\u0440\u043E\u0432\u0430\u043D\u043D\u044B\u0445 \u043A\u043B\u0438\u043D\u043A\u043E\u0432.","Medium armour lets this much DEX through.":"\u0421\u0440\u0435\u0434\u043D\u0438\u0439 \u
