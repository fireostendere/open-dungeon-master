name: Deployment and recovery
on:
  push:
    branches: [main, astra/installers-ops, astra/installation-final]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deployment-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Archive only tracked source, never credentials or runtime state
        run: |
          mkdir -p source-evidence
          git archive --format=tar.gz HEAD > source-evidence/source.tar.gz
          git rev-parse HEAD > source-evidence/commit.txt
          sha256sum source-evidence/source.tar.gz > source-evidence/source.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: deployment-source
          path: source-evidence
          retention-days: 1
          if-no-files-found: error
  fast:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s tests/deploy -v
      - name: Bash syntax and dry bootstrap
        if: runner.os == 'Linux'
        run: |
          bash -n install-server.sh
          sh -n scripts/docker-entrypoint.sh
          bash install-server.sh --plan
      - name: PowerShell syntax and non-mutating plan
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens=$null; $errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path install-local.ps1),[ref]$tokens,[ref]$errors) | Out-Null
          if ($errors.Count) { $errors | Format-List; exit 1 }
          ./install-local.ps1 -Plan -Root "$env:TEMP\odm-plan-only"
          if (Test-Path "$env:TEMP\odm-plan-only") { throw 'Plan changed the filesystem' }
          ./tests/deploy/test-bootstrap.ps1
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File tests/deploy/test-bootstrap.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Windows PowerShell 5.1 probe tests failed' }
  installed-linux:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Run the actual standalone installer against this exact commit
        run: |
          sudo bash install-server.sh --yes --root "$RUNNER_TEMP/odm-live" \
            --source "$GITHUB_WORKSPACE" --ref "$GITHUB_SHA" \
            --runtime none --skip-assets --port 13315
      - name: Real MCP external-art and progress E2E
        run: |
          mkdir -p "$RUNNER_TEMP/mcp-client"
          npm install --prefix "$RUNNER_TEMP/mcp-client" --no-save --package-lock=false @modelcontextprotocol/client@2.0.0
          cat > "$RUNNER_TEMP/mcp-client/smoke.mjs" <<'EOF'
          import { Client, StreamableHTTPClientTransport } from '@modelcontextprotocol/client';

          const token = process.env.ODM_MCP_TOKEN;
          if (!token) throw new Error('ODM_MCP_TOKEN missing');
          const transport = new StreamableHTTPClientTransport(new URL('http://127.0.0.1:3006/mcp'), {
            requestInit: { headers: { Authorization: `Bearer ${token}` } },
          });
          const client = new Client({ name: 'odm-deployment-ci', version: '1.0.0' });

          function unpack(result) {
            if (result.isError) throw new Error(JSON.stringify(result.content));
            if (result.structuredContent) return result.structuredContent;
            const text = result.content?.find((part) => part.type === 'text')?.text;
            return text ? JSON.parse(text) : {};
          }
          async function call(name, args) {
            return unpack(await client.callTool({ name, arguments: args }));
          }

          const png = Buffer.from(
            'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNkYPhfDwAChwGA60e6kgAAAABJRU5ErkJggg==',
            'base64',
          );

          try {
            await client.connect(transport);
            const listed = await client.listTools();
            const names = new Set(listed.tools.map((tool) => tool.name));
            for (const required of ['odm_server', 'odm_campaigns', 'odm_story', 'odm_sheets', 'odm_assets', 'odm_progress']) {
              if (!names.has(required)) throw new Error(`Missing MCP tool: ${required}`);
            }

            const status = await call('odm_server', { operation: 'status' });
            if (!status.ok || status.assetProtocolVersion !== 1) {
              throw new Error(`unexpected ODM status: ${JSON.stringify(status)}`);
            }
            const capabilities = await call('odm_server', { operation: 'capabilities' });
            if (!capabilities.externalAssets?.binaryUpload || !capabilities.characterProgressSync?.supported) {
              throw new Error(`missing extended capabilities: ${JSON.stringify(capabilities)}`);
            }

            const created = await call('odm_campaigns', {
              operation: 'create',
              title: 'External Asset CI Campaign',
              description: 'CI fixture campaign for MCP binary upload',
              theme: 'observatory',
              startingLevel: 1,
            });
            const campaignId = created.campaign.id;

            const planned = await call('odm_assets', { operation: 'plan_campaign', campaign_id: campaignId });
            if (!planned.pack?.id || !planned.pack.jobs?.length) throw new Error('plan_campaign returned no jobs');

            const packed = await call('odm_assets', {
              operation: 'create_pack',
              campaign_id: campaignId,
              title: 'CI external image pack',
              pack_type: 'integration_test',
              jobs: [{
                kind: 'campaign_cover',
                title: 'CI cover fixture',
                description: 'One generated fixture image',
                suggestedPrompt: 'A ruined observatory at night',
                target: { type: 'campaign', id: campaignId },
                dedupeKey: 'ci-cover',
              }],
            });
            const packId = packed.pack.id;
            const jobId = packed.pack.jobs[0].id;

            const claimed = await call('odm_assets', {
              operation: 'claim_job',
              job_id: jobId,
              worker_id: 'ci-external-worker',
              lease_seconds: 300,
            });
            if (claimed.job.claimedBy !== 'ci-external-worker') throw new Error('job claim failed');

            const grant = await call('odm_assets', {
              operation: 'create_upload',
              job_id: jobId,
              worker_id: 'ci-external-worker',
              expected_mime_type: 'image/png',
              expected_max_bytes: 1048576,
            });
            if (!grant.uploadUrl.startsWith('http://127.0.0.1:13315/api/assets/ingest/')) {
              throw new Error(`managed upload URL has wrong public origin: ${grant.uploadUrl}`);
            }
            const uploadResponse = await fetch(grant.uploadUrl, {
              method: 'PUT',
              headers: {
                Authorization: `Bearer ${grant.authorization.token}`,
                'Content-Type': 'image/png',
              },
              body: png,
            });
            const uploaded = await uploadResponse.json();
            if (!uploadResponse.ok || uploaded.uploaded?.sha256?.length !== 64) {
              throw new Error(`binary upload failed: ${uploadResponse.status} ${JSON.stringify(uploaded)}`);
            }

            const submitted = await call('odm_assets', {
              operation: 'submit_result',
              job_id: jobId,
              upload_id: grant.uploadId,
              worker_id: 'ci-external-worker',
              provider: 'fixture',
              model: 'ci-no-paid-model',
              prompt_used: 'A ruined observatory at night',
              variant_label: 'fixture-A',
              set_primary: true,
            });
            const assetId = submitted.asset.id;
            if (submitted.job.status !== 'ready' || submitted.asset.width !== 1 || submitted.asset.height !== 1) {
              throw new Error(`submit_result did not finalize asset: ${JSON.stringify(submitted)}`);
            }

            const listedAssets = await call('odm_assets', {
              operation: 'list_assets',
              campaign_id: campaignId,
              pack_id: packId,
            });
            if (!listedAssets.assets.some((asset) => asset.id === assetId)) throw new Error('asset not visible to another MCP call');

            const download = await call('odm_assets', {
              operation: 'create_download',
              asset_id: assetId,
            });
            const downloadResponse = await fetch(download.downloadUrl, {
              headers: { Authorization: `Bearer ${download.authorization.token}` },
            });
            const downloaded = Buffer.from(await downloadResponse.arrayBuffer());
            if (!downloadResponse.ok || !downloaded.equals(png)) throw new Error('scoped reference download mismatch');

            const character = await call('odm_characters', {
              operation: 'create',
              level: 1,
              role: 'pc',
              sheet: {
                name: 'CI Hero',
                race: 'human',
                class: 'fighter',
                subclass: '',
                background: 'soldier',
                abilities: { str: 16, dex: 12, con: 14, int: 10, wis: 11, cha: 10 },
                maxHp: 12,
                ac: 16,
                speed: 30,
                hitDice: { die: 'd10', total: 1, spent: 0 },
                proficiencies: {
                  saves: ['str', 'con'], skills: ['athletics'], expertise: [], languages: ['common'], tools: [], armor: ['all'], weapons: ['martial']
                },
                equipment: [],
                gold: 10,
                copper: 0,
                spellcasting: null,
              },
            });
            const instantiated = await call('odm_characters', {
              operation: 'instantiate',
              characterId: character.character.id,
              campaignId,
              targetLevel: 1,
            });
            const sheetId = instantiated.sheet.id;
            const synced = await call('odm_progress', {
              operation: 'sync_character',
              sheet_id: sheetId,
              expected_version: 0,
            });
            if (synced.revision !== 1 || synced.libraryCharacter.id !== character.character.id) {
              throw new Error(`character sync failed: ${JSON.stringify(synced)}`);
            }
            const finished = await call('odm_progress', {
              operation: 'finish_and_sync_party',
              campaign_id: campaignId,
              require_all_synced: true,
              confirm: true,
            });
            if (!finished.ended || finished.status !== 'ended' || finished.sync.totals.failed !== 0) {
              throw new Error(`finish_and_sync_party failed: ${JSON.stringify(finished)}`);
            }

            const health = await call('odm_assets', { operation: 'health', campaign_id: campaignId });
            if (!health.ok) throw new Error(`asset health failed: ${JSON.stringify(health)}`);
          } finally {
            await client.close().catch(() => undefined);
          }
          EOF
          sudo env ODM_MCP_TOKEN="$(sudo cat "$RUNNER_TEMP/odm-live/config/mcp.token")" \
            node "$RUNNER_TEMP/mcp-client/smoke.mjs"
      - name: Actual containers, encrypted game database, backup, restore, failure rollback
        run: sudo python3 tests/deploy/live.py --root "$RUNNER_TEMP/odm-live"
      - name: Capture non-secret deployment evidence
        if: always()
        run: |
          mkdir -p deployment-test-results
          sudo python3 "$RUNNER_TEMP/odm-live/tools/odmctl.py" --root "$RUNNER_TEMP/odm-live" status > deployment-test-results/status.json || true
          sudo /usr/local/bin/odm-mcpctl status > deployment-test-results/mcp-status.json || true
          sudo chmod -R a+rX deployment-test-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deployment-recovery-evidence-${{ matrix.os }}
          path: deployment-test-results
      - name: Stop only this test installation
        if: always()
        run: |
          sudo /usr/local/bin/odm-mcpctl stop || true
          sudo python3 "$RUNNER_TEMP/odm-live/tools/odmctl.py" --root "$RUNNER_TEMP/odm-live" stop || true
