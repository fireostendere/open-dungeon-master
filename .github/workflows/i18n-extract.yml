name: i18n coverage

on:
  pull_request:
  push:
    branches:
      - main
      - "fix/i18n-*"

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify English localization coverage
        run: npm run i18n:check
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build
