name: i18n extraction

on:
  push:
    branches:
      - work/i18n-complete

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Extract UI text into i18n keys
        run: npm run i18n:extract
      - name: Verify covered UI literals are keyed
        run: npm run i18n:check
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build
      - name: Commit extraction result
        if: github.actor != 'github-actions[bot]'
        run: |
          if git diff --quiet; then
            echo "No extraction changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app src/components src/lib/i18n/generated
          git commit -m "chore(i18n): extract UI text into keys"
          git push origin HEAD:work/i18n-complete
