name: i18n extraction
on:
  push:
    branches: [work/i18n-complete]
permissions:
  contents: write
concurrency:
  group: i18n-extraction-${{ github.ref }}
  cancel-in-progress: true
jobs:
  extract-and-verify:
    if: ${{ !contains(github.event.head_commit.message, 'chore(i18n): extract UI text into keys') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: work/i18n-complete
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Extract UI text into i18n keys
        run: npm run i18n:extract
      - name: Verify no covered UI literals remain
        run: npm run i18n:check
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: npm run build
      - name: Commit extracted catalog and keyed UI
        run: |
          if git diff --quiet; then
            echo "No extraction changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app src/components src/lib/i18n/generated
          git commit -m "chore(i18n): extract UI text into keys"
          git push origin HEAD:work/i18n-complete
