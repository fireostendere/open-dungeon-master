name: Provider boundaries
on:
  push:
    branches: [main, astra/browser-auth-review, astra/installers-ops]
  pull_request:
permissions:
  contents: read
concurrency:
  group: provider-boundaries-${{ github.ref }}
  cancel-in-progress: true
jobs:
  fast:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Offline protocol and connection tests (no install, keys or GPU)
        run: npm run test:providers
  official-codex:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install pinned official executable outside the project
        run: npm install --prefix "$RUNNER_TEMP/odm-codex" @openai/codex@0.154.0
      - name: Check real app-server protocol without login or model inference
        env:
          ODM_SMOKE_CODEX_BINARY: ${{ runner.temp }}/odm-codex/node_modules/@openai/codex/bin/codex.js
        run: node scripts/e2e/codex-protocol-smoke.mjs
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Installed framework accessibility guidance
        run: cat node_modules/next/dist/docs/03-architecture/accessibility.md
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Snapshot installed application dependency graph
        run: npm ls --all --json > "$RUNNER_TEMP/odm-app-deps-before.json"
      - name: Install pinned browser runtime outside application node_modules
        run: npm install --prefix "$RUNNER_TEMP/odm-browser" --no-save --package-lock=false playwright@1.63.0
      - name: Verify browser tooling did not change application dependencies
        run: |
          npm ls --all --json > "$RUNNER_TEMP/odm-app-deps-after.json"
          cmp "$RUNNER_TEMP/odm-app-deps-before.json" "$RUNNER_TEMP/odm-app-deps-after.json"
          git diff --exit-code -- package.json package-lock.json
      - name: Install Chromium
        run: node "$RUNNER_TEMP/odm-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Production admin, routes, restart and CLI integration
        env:
          ODM_PLAYWRIGHT_MODULE: ${{ runner.temp }}/odm-browser/node_modules/playwright/index.mjs
        run: node scripts/e2e/provider-auth.mjs
      - name: Solo campaign lifecycle E2E (creation, combat, art, restart, finish)
        env:
          ODM_PLAYWRIGHT_MODULE: ${{ runner.temp }}/odm-browser/node_modules/playwright/index.mjs
        run: node scripts/e2e/solo-campaign.e2e.mjs
      - name: 35-turn soak test with restarts and provider fault recovery
        run: node scripts/e2e/soak-turns.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: provider-browser-evidence
          path: provider-test-results
          if-no-files-found: ignore
